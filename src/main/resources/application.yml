spring:
  application:
    name: FinBase

  datasource:
    url: jdbc:postgresql://localhost:5432/finbase
    username: ${DB_USERNAME:finbase}
    password: ${DB_PASSWORD:finbase}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Second-level cache stays OFF, always. It caches entity state across
        # requests independent of the RLS session variable, so a row cached
        # while serving one financier can be served back to another on a
        # cache hit — a silent cross-tenant leak. See CLAUDE.md / tech-stack §2.2.
        cache:
          use_second_level_cache: false
          use_query_cache: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

finbase:
  jwt:
    # Must be overridden in every real environment via FINBASE_JWT_SECRET —
    # this placeholder exists only so local/dev boots without extra setup.
    secret: ${FINBASE_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
